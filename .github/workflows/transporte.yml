name: Estado oficial del Metro y Metrobús
on:
  schedule:
    # Los horarios de GitHub Actions pueden sufrir retrasos.
    - cron: '9,39 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transporte.yml'
      - 'scripts/estado_transporte.py'
      - 'tests/test_transport_status.py'
permissions:
  contents: write
concurrency:
  group: publicar-estado-transporte
  cancel-in-progress: false
jobs:
  consultar-transporte:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector del tablero público (MIT, versión fijada)
        run: python -m pip install --disable-pip-version-check 'observatorio==0.1.0'
      - name: Comprobar el esquema y casos de fallo sin red
        run: python -m unittest discover -s tests -p 'test_transport_status.py' -v
      - name: Consultar todas las líneas y comprobar integridad del tablero oficial
        run: python scripts/estado_transporte.py
      - name: Guardar actualización verificada de transporte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- transporte/estado.json
          if git diff --cached --quiet; then
            echo "El archivo de transporte no cambió."
            exit 0
          fi
          git commit -m "Estado de Metro y Metrobús consultado en fuente oficial"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Estado de transporte publicado."
              exit 0
            fi
            git rebase --abort || true
            # Si cambia el mismo archivo, recalcularlo antes de intentar otra vez.
            git fetch origin main
            git reset --hard origin/main
            python scripts/estado_transporte.py
            git add -- transporte/estado.json
            if git diff --cached --quiet; then
              echo "El archivo ya fue actualizado por otra ejecución."
              exit 0
            fi
            git commit -m "Actualizar estado de transporte tras sincronizar"
            sleep 2
          done
          echo "No fue posible publicar el estado tras varios intentos." >&2
          exit 1
