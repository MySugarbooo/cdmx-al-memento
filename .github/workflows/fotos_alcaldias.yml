name: Fotografía de las 16 alcaldías
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fotos_alcaldias.py'
      - 'assets/alcaldias/seleccion.json'
      - '.github/workflows/fotos_alcaldias.yml'
permissions:
  contents: write
concurrency:
  group: fotos-por-alcaldia-cdmx
  cancel-in-progress: false
jobs:
  fotografia-alcaldias:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de fotografías
        run: python -m pip install --quiet 'Pillow>=10,<12' 'requests>=2.31,<3'
      - name: Descargar y verificar una foto para cada alcaldía
        run: python -u scripts/fotos_alcaldias.py
      - name: Publicar fotografías y créditos en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/alcaldias/*.jpg assets/alcaldias/fotos.json
          if ! git diff --cached --quiet; then
            git commit -m "Fotografías verificadas de las 16 alcaldías"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
