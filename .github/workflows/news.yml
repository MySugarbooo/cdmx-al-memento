name: Actualizar noticias CDMX AL MEMENTO

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/news.yml'

permissions:
  contents: write

concurrency:
  group: noticias-cdmx-al-memento
  cancel-in-progress: false

jobs:
  actualizar-noticias:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos del periodico
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtener titulares recientes
        run: python update_news.py
      - name: Guardar noticias y actualizar la pagina
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar titulares de CDMX"
            git push
          fi
