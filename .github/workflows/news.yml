name: Actualizar noticias CDMX AL MEMENTO
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/news.yml'
      - 'update_news.py'
      - 'scripts/generar_guias.py'
      - 'scripts/notas_locales.py'
      - 'tests/test_local_news.py'
      - 'assets/noticias-locales.js'
      - 'scripts/analisis_editorial.py'
      - 'tests/test_editorial.py'
      - 'assets/agenda.js'
      - 'assets/comments.js'
      - 'assets/comments-config.js'
      - 'assets/comments.css'
      - 'noticias/index.html'
      - 'comunidad/index.html'
      - 'firebase/firestore.rules'
      - 'reportes-ciudadanos/index.html'
      - 'assets/reportes-ciudadanos.js'
      - 'assets/reportes-ciudadanos.css'
      - 'assets/premium-2026.css'
      - 'tests/test_premium_ui.py'
      - 'tests/test_estadisticas.py'
      - 'estadisticas/index.html'
      - 'assets/estadisticas.js'
      - 'assets/estadisticas.css'
      - 'tests/test_citizen_reports.py'
      - 'tests/test_citizen_reports.mjs'
      - 'firebase/asignar-moderador.mjs'
      - 'firebase/README.md'
      - 'tests/test_community_site.py'
      - 'tests/test_community_votes.py'
      - 'tests/test_community_profiles.py'
      - 'tests/test_moderation_advanced.py'
      - 'moderacion/index.html'
      - 'assets/moderacion-avanzada.js'
      - 'assets/moderacion-avanzada.css'
      - 'perfiles/index.html'
      - 'assets/community-profiles.css'
      - 'assets/community-profiles.js'
      - 'assets/forum-votes.css'
      - 'privacidad.html'
      - 'sitemap.xml'
      - '_headers'
      - 'assets/negocios.js'
      - 'assets/herramientas.js'
      - 'assets/calendario-laboral.js'
      - 'assets/explora-list.js'
      - 'agenda/eventos.json'
      - 'tests/test_monetizacion.py'
      - 'tests/test_portal.py'
      - 'tests/test_profiles.py'
      - 'scripts/actualizar_fotos.py'
      - 'scripts/animales_feed.py'
      - 'scripts/recuperar_octubre_2026.py'
      - 'tests/test_photos.py'
      - 'tests/test_photo_policy.py'
      - 'assets/fotos/hechos-verificados.json'
      - 'assets/fotos/contexto-tematico.json'
      - 'tests/test_archive.py'
      - 'tests/test_profiles.py'
      - 'tests/test_transitions.py'
      - 'assets/page-transitions.js'
      - 'assets/neo-site.css'
      - 'assets/neo-home.css'
      - 'assets/neo-home.js'
      - 'noticias-en-desarrollo/index.html'
      - 'assets/noticias-en-desarrollo.js'
      - 'assets/noticias-en-desarrollo.css'
      - 'tests/test_development_news.py'
      - 'assets/verificacion.css'
      - 'tests/test_verification_ui.py'
      - 'assets/neo-sections.js'
      - 'seguridad/index.html'
      - 'servicios/index.html'
      - 'cdmx/index.html'
      - 'fotografias/index.html'
      - 'assets/neo-gallery.js'
      - 'app.js'
      - 'styles.css'
      - 'tests/test_portal.py'
      - 'tests/test_weather.py'
      - 'tests/test_transport_status.py'
      - 'tests/test_transporte_api.mjs'
      - 'scripts/estado_transporte.py'
      - 'functions/api/estado-transporte.js'
      - 'assets/estado-transporte.js'
      - 'assets/estado-transporte.css'
      - 'movilidad/index.html'
      - 'trafico/index.html'
      - 'assets/trafico.js'
      - 'assets/trafico.css'
      - 'functions/api/trafico.js'
      - 'tests/test_traffic_page.py'
      - 'tests/test_trafico_api.mjs'
      - 'aire/index.html'
      - 'assets/aire.js'
      - 'assets/aire.css'
      - 'functions/api/aire.js'
      - 'functions/api/contingencias.js'
      - 'tests/test_air_page.py'
      - 'tests/test_aire_api.mjs'
      - 'cerca/index.html'
      - 'avisos/index.html'
      - 'tests/test_kisumi_studio.py'
      - 'kisumi-studio/**'
      - 'functions/api/clima.js'
      - 'assets/clima-ticker.js'
permissions:
  contents: write
concurrency:
  group: noticias-cdmx-al-memento
  cancel-in-progress: false
jobs:
  actualizar-noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar guías originales de las 16 alcaldías
        run: python scripts/generar_guias.py
      - name: Verificar ubicación, fecha y retención antes de actualizar
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verificar sintaxis de los scripts interactivos
        run: |
          node --check app.js
          node --check assets/page-transitions.js
          node --check assets/neo-home.js
          node --check assets/noticias-en-desarrollo.js
          node --check assets/neo-sections.js
          node --check assets/neo-gallery.js
          node --check kisumi-studio/studio.js
          node --check assets/noticias-locales.js
          node --check assets/estadisticas.js
          node --check assets/portal.js
          node --check assets/clima-ticker.js
          node --check --input-type=module < functions/api/clima.js
          node --check --input-type=module < functions/api/estado-transporte.js
          node --check --input-type=module < functions/api/trafico.js
          node --check assets/trafico.js
          node tests/test_trafico_api.mjs
          node --check assets/aire.js
          node --check assets/reportes-ciudadanos.js
          node tests/test_citizen_reports.mjs
          node --check --input-type=module < functions/api/aire.js
          node --check --input-type=module < functions/api/contingencias.js
          node tests/test_aire_api.mjs
          node --check assets/estado-transporte.js
          node tests/test_transporte_api.mjs
          node --check assets/comments.js
          node --check assets/community-profiles.js
          node --check --input-type=module < assets/moderacion-avanzada.js
          node --check firebase/asignar-moderador.mjs
          node --check assets/comments-config.js
          node --check assets/agenda.js
          node --check assets/negocios.js
          node --check assets/herramientas.js
          node --check assets/calendario-laboral.js
          node --check assets/explora-list.js
          node --check mapa/mapa.js
      - name: Recopilar titulares y actualizar archivo anual
        run: python update_news.py
      - name: Recuperar noticias históricas pendientes del 16 al 24 de octubre
        run: python scripts/recuperar_octubre_2026.py
      - name: Generar titulares recientes de animales
        run: python scripts/animales_feed.py
      - name: Buscar fotografías recientes y revisar licencias en Wikimedia Commons
        run: python scripts/actualizar_fotos.py
      - name: Publicar cambios y eliminar noticias vencidas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- animales/actualidad.html news.json reports.json reportes/ archivo/ alcaldias/noticias.json sitemap.xml assets/fotos/recientes.json descubre/
          if git diff --cached --quiet; then
            echo "Noticias y guías sin cambios."
            exit 0
          fi
          git commit -m "Actualización y depuración automática de noticias CDMX"
          if git pull --rebase origin main && git push origin HEAD:main; then
            echo "Noticias publicadas."
            exit 0
          fi
          # El contenido RSS puede cambiar mientras se edita el repositorio.
          # Recalcular desde la versión más reciente evita conflictos en news.json.
          git rebase --abort || true
          for attempt in 1 2 3; do
            echo "Reconstruyendo cambios sobre main actualizado: intento $attempt"
            git fetch origin main
            git reset --hard origin/main
            python scripts/generar_guias.py
            python update_news.py
            python scripts/animales_feed.py
            python scripts/actualizar_fotos.py
            git add -A -- news.json reports.json reportes/ archivo/ alcaldias/noticias.json sitemap.xml assets/fotos/recientes.json descubre/
            if git diff --cached --quiet; then
              echo "El repositorio ya tiene las últimas noticias."
              exit 0
            fi
            git commit -m "Actualización y depuración automática de noticias CDMX"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo "No fue posible publicar después de tres intentos." >&2
          exit 1
