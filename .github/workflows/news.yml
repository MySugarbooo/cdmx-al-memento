name: Actualizar noticias CDMX AL MEMENTO
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/news.yml'
      - 'update_news.py'
permissions:
  contents: write
concurrency:
  group: noticias-cdmx-al-memento
  cancel-in-progress: false
jobs:
  actualizar-noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recopilar noticias y generar reportes
        run: python update_news.py
      - name: Guardar la actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json reports.json reportes/ sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Noticias y reportes automáticos CDMX"
            git push
          fi
