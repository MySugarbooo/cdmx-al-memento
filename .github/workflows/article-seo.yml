name: Generate crawlable article pages
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'
  push:
    paths:
      - 'news.json'
      - 'scripts/build_article_seo.py'
permissions:
  contents: write
concurrency:
  group: article-seo-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate article HTML and XML
        run: python scripts/build_article_seo.py
      - name: Commit only generated SEO artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articulos/ sitemap-articulos.xml robots.txt index.html archivo/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update crawlable article pages"
            # Another workflow may update main while pages are generated.
            # Rebase the generated commit onto the latest remote branch.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Generated files conflict with upstream changes; aborting safely."
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Remote branch changed during push (attempt $attempt); retrying."
              sleep 3
            done
            echo "Could not publish generated pages after five safe retries."
            exit 1
          fi
