name: Generate crawlable article pages
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'
  push:
    paths:
      - 'news.json'
      - 'scripts/build_article_seo.py'
permissions:
  contents: write
concurrency:
  group: article-seo-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate article HTML and XML
        run: python scripts/build_article_seo.py
      - name: Commit only generated SEO artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articulos/ sitemap-articulos.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update crawlable article pages"
            git push
          fi
