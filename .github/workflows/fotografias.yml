name: Descargar fotos verificadas CDMX
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/descargar_fotos.py'
      - 'assets/fotos-manifest.json'
      - '.github/workflows/fotografias.yml'
permissions:
  contents: write
concurrency:
  group: fotografias-cdmx-main
  cancel-in-progress: false
jobs:
  fotos-reales:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar procesador de imágenes
        run: python -m pip install --quiet 'Pillow>=10,<12' 'requests>=2.31,<3'
      - name: Obtener fotografías originales y validar sus archivos
        run: python scripts/descargar_fotos.py
      - name: Guardar las fotos en la rama principal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fotos/
          if ! git diff --cached --quiet; then
            git commit -m "Añadir fotos reales comprobadas para CDMX"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Fotos ya verificadas, sin cambios."
          fi
